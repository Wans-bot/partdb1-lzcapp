locales:
  zh-CN:
    name: Part-DB 元器件库存
    description: 开源电子元器件库存管理系统：管理元器件、封装与参数、库存与最小库存告警、供应商与采购价格历史、项目 BOM 配单，支持条码标签与 REST API
    usage: >
      Part-DB 是一套面向电子工程师、维修与创客的开源元器件库存管理系统，用来管理元件库存、封装与参数、供应商与采购价、以及项目 BOM 清单。


      【登录信息】

      首次打开应用会自动登录，无需手动输入账号密码。

      默认管理员账号：admin，默认密码 PartDB123456（首次打开会自动登录，无需手动输入；可在应用内自行修改密码）。

      需要换账号登录时：先在应用内点「注销」退出登录，登录页上会出现「一键重新登录」按钮；

      此时可直接在登录表单里输入其它账号的账号密码登录。


      【快速上手】

      1. 登录后先建「分类」(如 电阻/电容/单片机) 与「器件封装」、「供应商」、「制造商」。

      2. 进「元器件」新建器件：填写名称、分类、封装、参数（如阻值、容值、耐压）、库存数量与最小库存、存放位置。

      3. 有库存数量后，系统会自动统计总价值与低库存告警，首页仪表盘可见。

      4. 「采购信息」里记录供应商、货号与价格，可保留价格历史，方便比价与补货。

      5. 「项目 / BOM」把器件挂到项目下，配单时直接看缺料与总成本。

      6. 需要盘库或贴标签时，可用二维码/条码标签打印，手机扫码即查库存。


      【数据导入导出】

      已接入云盘文件选择器：导出 CSV/ZIP
      备份、导入器件清单、上传器件图片或数据手册时，会直接打开云盘文件选择界面，文件来自你自己的网盘，无需中转。


      【数据持久化】

      数据库（SQLite）与附件保存在应用私有目录（/lzcapp/var/partdb/），重启或升级应用都不会丢失。


      【关于更新】

      应用由懒猫微服商店统一分发与更新，应用内不需要、也不提供更新入口。


      【主要功能】

      - 元器件/分类/封装/制造商/供应商/存放位置 全字段管理

      - 库存与最小库存告警、总价值统计、价格历史

      - 项目 BOM 配单、订单与采购记录

      - CSV/JSON 导入导出、ZIP 全量备份、REST API、KiCad 集成

      - 中文界面（默认语言已设为简体中文）
  en-US:
    name: Part-DB
    description: >-
      Open-source electronic component inventory management: parts, footprints
      and parameters, stock levels with minimum-stock warnings, suppliers and
      price history, project BOMs, barcode labels and a REST API
    usage: >
      Part-DB is an open-source inventory management system for electronic

      components: parts, footprints and parameters, suppliers and prices, plus

      project BOMs.


      Sign-in

      The app signs you in automatically - no username or password to type.

      Default administrator: admin, default password PartDB123456 (the app signs

      you in automatically, so there is nothing to type; change the password in

      the app if you want). To use another account, click "Logout" inside the app;

      a "Sign in again" button appears on the login page and you can type other

      credentials in the form.


      Updates

      The app is delivered and updated by the LazyCat store; there is no in-app

      update entry and none is needed.


      Getting started

      1. Create categories (resistor, capacitor, MCU...), footprints, suppliers
         and manufacturers.
      2. Add parts with parameters, footprint, stock level, minimum stock and
         storage location.
      3. The dashboard shows total value and low-stock warnings automatically.

      4. Store supplier part numbers and prices per part to keep a price
      history.

      5. Attach parts to projects (BOM) to see missing parts and total cost.

      6. Print QR/barcode labels and scan them from a phone to look up stock.


      Import and export

      Cloud drive integration is enabled: CSV/ZIP export or import, datasheet
      and

      image upload use the drive file picker directly.


      Persistence

      The SQLite database and attachments live in the app's private directory

      (/lzcapp/var/partdb/) and survive restarts and updates.
format: v2
is_app: true
